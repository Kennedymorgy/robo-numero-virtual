name: Burlar Encurtador

on:
  workflow_dispatch:
    inputs:
      short_url:
        description: 'Cole a URL encurtada aqui'
        required: true
        default: 'https://shrtslug.biz/97rjy'

jobs:
  run-python-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install curl_cffi beautifulsoup4

      - name: Executar Script
        env:
          SHORT_URL: ${{ github.event.inputs.short_url }}
          FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }} # Se usar secret no Firebase
        run: |
          python seu_script.py
