name: Gerador SEO YouTube Inteligente

on:
  workflow_dispatch:
    inputs:
      game_name:
        description: 'Nome do Jogo (ex: FR Legends, 8 Ball Pool, Dragon Ball Z)'
        required: true
        default: 'FR Legends'
      game_version:
        description: 'Versão/Detalhes [OPCIONAL] (ex: v0.4.8, v56.30.1, PT-BR)'
        required: false
        default: ''
      category:
        description: 'Tipo de Conteúdo'
        required: true
        type: choice
        options:
          - 'android'
          - 'ppsspp'
        default: 'android'
      language_mode:
        description: 'Idioma das Tags/Buscas'
        required: true
        type: choice
        options:
          - 'ambos'
          - 'pt_br'
          - 'ingles'
        default: 'ambos'

jobs:
  gerar-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar biblioteca de requisições
        run: pip install requests

      - name: Rodar Gerador SEO
        env:
          GAME_NAME: ${{ github.event.inputs.game_name }}
          GAME_VERSION: ${{ github.event.inputs.game_version }}
          CATEGORY: ${{ github.event.inputs.category }}
          LANGUAGE_MODE: ${{ github.event.inputs.language_mode }}
        run: python seo_bot.py
